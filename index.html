<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0a0e27">
  <meta name="description" content="ثبت و پیگیری مصرف سیگار به‌صورت آفلاین با تقویم شمسی - Glassmorphism Design">
  <title>سیگارشمار</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===== Header ===== -->
  <header class="hero">
    <div class="hero-top">
      <h1>سیگارشمار</h1>
      <button id="btnSettings" class="icon-btn" aria-label="تنظیمات" title="تنظیمات">⚙️</button>
    </div>

    <!-- ===== Stock Card ===== -->
    <div class="stock-card">
      <div class="stock-number" id="stockNumber">۰</div>
      <div class="stock-label">نخ سیگار موجود</div>
      <div class="pack-ticks" id="packTicks" aria-hidden="true"></div>
    </div>
  </header>

  <!-- ===== Action Buttons ===== -->
  <section class="actions">
    <button class="action-btn buy" data-action="purchase" aria-label="خرید پاکت جدید">
      <span class="a-icon">📦</span>
      <span class="a-title">خرید پاکت</span>
      <span class="a-sub">۲۰ نخ + قیمت</span>
    </button>

    <button class="action-btn smoke" data-action="smoke" aria-label="کشیدن یک نخ">
      <span class="a-icon">🔥</span>
      <span class="a-title">کشیدن یک نخ</span>
      <span class="a-sub">از موجودی من</span>
    </button>

    <button class="action-btn borrow" data-action="borrow_smoke" aria-label="نخ قرضی کشیدم">
      <span class="a-icon">🤝</span>
      <span class="a-title">نخ قرضی کشیدم</span>
      <span class="a-sub">از موجودی من نیست</span>
    </button>

    <button class="action-btn lend" data-action="lend" aria-label="قرض دادم">
      <span class="a-icon">🎁</span>
      <span class="a-title">قرض دادم</span>
      <span class="a-sub">از موجودی من کم می‌شود</span>
    </button>
  </section>

  <!-- ===== Daily Stats ===== -->
  <section class="panel">
    <div class="panel-head">
      <h2>📊 آمار روزانه (۲۴ ساعته)</h2>
    </div>
    <div class="table-wrap">
      <table id="statsTable">
        <thead>
          <tr>
            <th>روز</th>
            <th>نخ کشیده‌شده</th>
            <th>پاکت خریداری‌شده</th>
            <th>قرض داده‌شده</th>
          </tr>
        </thead>
        <tbody id="statsBody"></tbody>
      </table>
      <p class="empty-hint" id="statsEmpty">هنوز داده‌ای ثبت نشده است.</p>
      <button class="show-more-btn" id="statsToggleBtn" style="display:none"></button>
    </div>
  </section>

  <!-- ===== Monthly Insights ===== -->
  <section class="panel" id="insightsPanel">
    <div class="panel-head">
      <h2>📈 بینش ماهانه</h2>
    </div>
    <div id="insightsContent"></div>
  </section>

  <!-- ===== History ===== -->
  <section class="panel">
    <div class="panel-head">
      <h2>⏱️ تاریخچه</h2>
    </div>
    <ul class="history-list" id="historyList"></ul>
    <p class="empty-hint" id="historyEmpty">هنوز رویدادی ثبت نشده است.</p>
  </section>

  <!-- ===== Footer ===== -->
  <footer class="foot">
    <span id="storageBadge"></span>
  </footer>
</div>

<!-- ===== Modal Dialog ===== -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- ===== Toast Notification ===== -->
<div class="toast" id="toast"></div>

<!-- ===== Scripts ===== -->
<script src="jalali.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
