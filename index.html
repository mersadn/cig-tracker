<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#17181A">
<meta name="description" content="ثبت و پیگیری مصرف سیگار به‌صورت آفلاین با تقویم شمسی">
<title>سیگارشمار</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180-maskable.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===== Header : inventory ===== -->
  <header class="hero">
    <div class="hero-top">
      <h1>سیگارشمار</h1>
      <button id="btnSettings" class="icon-btn" aria-label="تنظیمات" title="تنظیمات">⚙</button>
    </div>

    <div class="stock-card">
      <div class="stock-number" id="stockNumber">۰</div>
      <div class="stock-label">نخ سیگار موجود</div>
      <div class="pack-ticks" id="packTicks" aria-hidden="true"></div>
    </div>
  </header>

  <!-- ===== Actions ===== -->
  <section class="actions">
    <button class="action-btn buy" data-action="purchase">
      <span class="a-icon">📦</span>
      <span class="a-title">خرید پاکت</span>
      <span class="a-sub">۲۰ نخ + قیمت</span>
    </button>

    <button class="action-btn smoke" data-action="smoke">
      <span class="a-icon">🔥</span>
      <span class="a-title">کشیدن یک نخ</span>
      <span class="a-sub">از موجودی من</span>
    </button>

    <button class="action-btn borrow" data-action="borrow_smoke">
      <span class="a-icon">🤝</span>
      <span class="a-title">نخ قرضی کشیدم</span>
      <span class="a-sub">از موجودی من نیست</span>
    </button>

    <button class="action-btn lend" data-action="lend">
      <span class="a-icon">🎁</span>
      <span class="a-title">قرض دادم</span>
      <span class="a-sub">از موجودی من کم می‌شود</span>
    </button>
  </section>

  <!-- ===== Stats table ===== -->
  <section class="panel">
    <div class="panel-head">
      <h2>آمار روزانه (۲۴ ساعته)</h2>
    </div>
    <div class="table-wrap">
      <table id="statsTable">
        <thead>
          <tr>
            <th>روز</th>
            <th>نخ کشیده‌شده</th>
            <th>پاکت خریداری‌شده</th>
            <th>قرض داده‌شده</th>
          </tr>
        </thead>
        <tbody id="statsBody"></tbody>
      </table>
      <p class="empty-hint" id="statsEmpty">هنوز داده‌ای ثبت نشده است.</p>
    </div>
  </section>

  <!-- ===== History ===== -->
  <section class="panel">
    <div class="panel-head">
      <h2>تاریخچه</h2>
    </div>
    <ul class="history-list" id="historyList"></ul>
    <p class="empty-hint" id="historyEmpty">هنوز رویدادی ثبت نشده است.</p>
  </section>

  <footer class="foot">
    <span id="storageBadge"></span>
  </footer>
</div>

<!-- ===== Generic modal ===== -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="jalali.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
